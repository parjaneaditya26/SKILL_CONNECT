<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - Skill Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.php">Home</a>
    <a href="profile.html">My Profile</a>
    <a href="browse.php">Browse Skills</a>
    <a href="requests.php">My Requests</a>
  </nav>

  <header>
    <h1>My Profile</h1>
    <p>Tell others what you can teach and what you want to learn.</p>
  </header>

  <main>
    <form id="profileForm" action="save_profile.php" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Priya Sharma" required>
      </div>
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required>
      </div>
      <div class="form-group">
        <label for="password">Password (to protect your profile)</label>
        <input type="password" id="password" name="password" placeholder="Choose a password" required>
      </div>
      <div class="form-group">
        <label for="teachSkill">Skill You Can Teach</label>
        <input type="text" id="teachSkill" name="teachSkill" placeholder="e.g. Guitar (optional)">
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="">-- Select a category --</option>
          <option value="Music">Music</option>
          <option value="Tech">Tech</option>
          <option value="Cooking">Cooking</option>
          <option value="Sports">Sports</option>
          <option value="Language">Language</option>
          <option value="Art">Art</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="learnSkill">Skill You Want to Learn</label>
        <input type="text" id="learnSkill" name="learnSkill" placeholder="e.g. Photography (optional)">
      </div>

      <button type="submit">Save Profile</button>
    </form>

    <div class="danger-zone">
      <h3>Delete Your Profile</h3>
      <p>Enter your name and password to permanently remove your profile.</p>
      <form action="delete_profile.php" method="POST" onsubmit="return confirm('Are you sure? This cannot be undone.');">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="password" name="password" placeholder="Your password" required>
        <button type="submit" class="deleteBtn">Delete Profile</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
  <footer>
    <p>Skill Connect &copy; 2026 — A College Project (CEP)</p>
    <p>Built with HTML, CSS, JavaScript, PHP & MySQL</p>
  </footer>
</body>
</html>
